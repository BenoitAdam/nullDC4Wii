;; NullDC4Wii - Game Presets Configuration
;; Place this file at: sd:/discs/game_presets.cfg
;;
;; HOW IT WORKS:
;;   Each [keyword] is matched case-insensitively as a substring of the disc filename.
;;   A section may list several aliases on one line — [name1][name2][name3] —
;;   and applies if ANY of them matches (e.g. [streetfighter32][doubleimpact]).
;;   The first alias is the name shown in the options menu. Up to 8 per section.
;;   The FIRST matching rule wins — put more specific entries BEFORE general ones.
;;   Only fields you list are changed; everything else keeps the user's UI selection.
;;   The options menu opens AFTER the preset is applied, so users can still override.
;;
;;   LAUNCHED WITH ARGUMENTS (RiftWii or any front-end that starts boot.dol with a
;;   command line):   boot.dol -game sd:/roms/dreamcast/PowerStone.cdi -preset powerstone
;;     -game    full path of the disc image; the file browser and both menus are skipped.
;;     -preset  the keyword is matched against the [alias] groups exactly like a
;;              filename would be (first match wins, same Wii-U <angle> gating), so
;;              "powerstone" selects [powerstone] and "shenmue2" selects [shenmue2]
;;              ahead of [shenmue]. "auto" or no -preset = the normal filename match.
;;              A name with no matching section falls back to the filename match.
;;     [default] is applied first in every case. Boot log: "[game_presets] Forced preset".
;;
;;   Angle brackets are the SAME alias match as square brackets, but ONLY
;;   apply on real Wii U hardware running vWii — e.g. <segatetris><sega tetris>.
;;   [square] and <angle> groups may be mixed freely on one line, in any order;
;;   if ANY group on the line uses <angle> brackets, the whole section is
;;   Wii-U-gated. A real Wii just falls through to a plain [square] section
;;   for the same game below it. Put the <angle> section FIRST, same
;;   "more specific before general" rule:
;;
;;     <segatetris><sega tetris>        ; Wii U
;;     accuracy_int=accurate
;;
;;     [segatetris][sega tetris]        ; Wii (fallback for everyone else)
;;     accuracy_int=fast
;;
;; SETTINGS REFERENCE:
;;   accuracy_int = fast | balanced | accurate  (ACCURACY INT: SH4 interpreter/scheduler
;;                 timing - timeslice 1792/896/448 + peripheral polling)
;;   accuracy_fpu = fast | balanced | accurate  (ACCURACY FPU: FIPR/FTRV intermediate
;;                 precision in the interpreter FPU handlers; fast = float, balanced/accurate
;;                 = double. The JIT's native fipr/ftrv ignore it - see jit_fipr.)
;;   graphics    = low | normal   (TEXTURE FILTER ONLY: low = GX_NEAR point sampling,
;;                 best for 240p games whose art already matches the output resolution;
;;                 normal = GX_LINEAR bilinear. The old high/extra levels were nothing but
;;                 normal plus a fixed lod_bias/bias-clamp/aniso bundle - those are the three
;;                 separate keys below now. Old configs saying high/extra still load: they map
;;                 to normal and log a line pointing at gx=/lod_bias=/aniso=)
;;   gx          = on | off   (GX_ENABLE/GX_DISABLE of GX_InitTexObjLOD's biasclamp + edgelod
;;                 pair - the only two GX_DISABLE/GX_ENABLE arguments that call takes.
;;                 biasclamp stops lod_bias from pushing a minified texel past the point where
;;                 its footprint no longer covers the pixel (blur/shimmer on steep surfaces);
;;                 edgelod computes the LOD from adjacent instead of diagonal texels.
;;                 off by default = legacy. aniso below forces edgelod on by itself, since
;;                 libogc requires it whenever maxaniso > 1. gx_enable/gx_disable are
;;                 accepted spellings of on/off here)
;;   lod_bias    = -1 | -0.75 | -0.5 | 0.0 | 0.5   (texture LOD bias added to the computed LOD
;;                 before the mip/filter decision: negative sharpens - samples a larger level
;;                 than the footprint asks for - positive blurs. 0.0 (default) is the hardware
;;                 default and a true no-op)
;;   aniso       = 0x | 2x | 4x   (anisotropic filtering: the TX unit iterates its square
;;                 filter along the axis of anisotropy, one extra filter cycle per level -
;;                 sharper textures on surfaces seen at a steep angle, at fill-rate cost.
;;                 Hollywood only implements 1x/2x/4x - there is no 8x mode on this GPU; an
;;                 old aniso=8x line loads clamped to 4x.
;;                 REQUIRES mipmap=fast or mipmap=trilinear: aniso is only iterated when the
;;                 min filter is GX_LIN_MIP_LIN, which needs a generated mip chain, so it does
;;                 NOTHING in a game left at mipmap=off (the default). Asking for 2x/4x does
;;                 promote an already-mipmapped texture to trilinear on its own.
;;                 0x (default) = off)
;;   ratio       = original | fullscreen | auto   (auto = match Wii system 4:3/16:9 aspect)
;;   adv_alpha   = on | off
;;   frameskip   = 0 | 1 | 2 | auto | auto_max
;;                 auto     = drop renders while behind real time, min 1 render in 4
;;                 auto_max = same, but up to 9 skips in a row (speed over framerate)
;;                 both hold emulated time at 100% speed; the FPS counter shows the
;;                 RENDER rate, so a low FPS with SPEED at 100% is working as intended
;;   tex_cache   = very_fast | very_fast_plus | fast | normal | normal_plus | quality
;;                 very_fast      = original skmp direct-slot cache: fastest, but slots are
;;                                  derived from the texture address with no size accounting,
;;                                  so a texture that decodes bigger than its slot overruns
;;                                  the next one (VQ is the worst case: ~4x). That overrun is
;;                                  the "very_fast need to be re-tested (very_fast+ and vq_cmpr=on)/buggy" corruption.
;;                 very_fast_plus = very_fast's address-derived texture slots -- which never
;;                                  evict anything, and measured 0 decodes/frame against
;;                                  normal's 73 on the same Buggy Heat scene -- with the
;;                                  textures that would overrun such a slot routed into a
;;                                  properly sized arena instead. Plus three fixes:
;;                                  (1) a stride-selected texture decodes 512 pixels wide, not
;;                                      the width it declares, so its slot was up to 16x too
;;                                      small and the decode ran off the end of it. In the
;;                                      per-frame quality arena that overrun is harmless (it
;;                                      lands on space not handed out yet); in the persistent
;;                                      fast/normal arena it permanently wrecks a neighbouring
;;                                      cached texture, which then re-decodes forever and can
;;                                      overrun the NEXT one. That is why 2D menus look wrong
;;                                      AND run slowly on fast/normal but are fine on
;;                                      very_fast and quality.
;;                                  (2) stride surfaces are validated by hashing 8 words of
;;                                      their contents. very_fast and quality never cache them
;;                                      at all (correct, but every draw re-converts 512*h
;;                                      texels); hashing lets static menu art cache while
;;                                      animated art still refreshes.
;;                                  (3) the cache sentinel is written at the un-mipped address.
;;                                      fast/normal write it past the mip levels, where the hit
;;                                      test never looks, so no mipmapped texture ever caches
;;                                      and the stomp lands in the visible full-size level.
;;                                  Try this first when very_fast is the only fast option but
;;                                  shows corruption.
;;                 normal_plus    = normal's persistent cache, but a texture is re-decoded when
;;                                  ANY VRAM byte it is built from was written since its last
;;                                  decode. normal (and fast/very_fast/very_fast_plus) only
;;                                  watch the texture's first word, so a game refilling a
;;                                  sprite atlas tile by tile keeps drawing last frame's tiles:
;;                                  characters "move like a puzzle" (Street Fighter III 3rd
;;                                  Strike, Guilty Gear X). quality hides that by re-decoding
;;                                  every texture every frame; normal_plus only re-decodes what
;;                                  was written. Every emulator VRAM write path stamps its 2 KB
;;                                  page; the one it cannot see (SH4 stores straight into the
;;                                  64-bit VRAM area) is backstopped by an 8-word content
;;                                  check. With DEBUG MESSAGE on, the [TEXC] line in
;;                                  /ndclog.txt reports stale=N: hits that were wrong anyway
;;                                  (0 = airtight for that game). Also accepts normal+.
;;   ppz_write   = on | off   (PVR Polygon-List Z write fix — Test Drive 6, Demolition Racer)
;;   vq_cmpr     = on | off   (VQ textures -> GX CMPR/DXT1 at 4 bits/texel instead of
;;                 16bpp. Pairs with tex_cache=very_fast_plus, and helps plain very_fast
;;                 too, which uses the same slots: at that size a VQ texture
;;                 fits its address-derived slot, so it stops overrunning the texture
;;                 next to it -- the classic very_fast VQ corruption -- and stops needing
;;                 the overflow arena. Second lossy pass on top of VQ, so smooth
;;                 gradients band; 565 VQ only. Default off.)
;;   4bpp        = i4_stub | 4bpp_optimized | ci4_fast | ci4_normal | rgb565
;;   8bpp        = i8_stub | 8bpp_optimized | ci8_fast | ci8_normal | rgb565
;;   players     = 1 | 2 | 3 | 4
;;   controller  = standard | lightgun | maracas | keyboard | fishingrod
;;   framebuffer_2d = on | off   (2D Framebuffer rendering — try for 2D games)
;;   fmv_format     = cmpr | rgba8 | rgb565 | tev   (FMV/YUV422 texture upload format)
;;                    cmpr/rgba8/rgb565 all run the full BT.601 YUV->RGB matrix on the PPC,
;;                    per pixel, per FMV frame, then pack the result (cmpr also runs a DXT1
;;                    block encoder on top). tev does no colour math at all on the CPU: it
;;                    uploads the source as two RAW planes (I8 luma + half-width IA8 chroma)
;;                    and the matrix runs in the GameCube/Wii TEV combiner, in the fragment
;;                    pipeline the FMV quad was already going through. Same 2 bytes/texel as
;;                    rgb565, and the chroma plane gets hardware bilinear interpolation the
;;                    CPU paths never did, so it also looks slightly better. Costs 8 TEV
;;                    stages while an FMV quad is drawn (fill rate), and the 8-bit combiner
;;                    coefficients drift ~1-2 LSB from the CPU matrix. Try it on any game
;;                    where FMV playback is the slow part.
;;   jojo_fix       = on | off   (gxRend.cpp TLUT-reupload-skip + CACHE_FAST PalSelect-masking,
;;                             tuned for Jojo's Bizarre Adventure — off by default elsewhere)
;;   decal_alpha    = on | off   (ShadInstr==2 DecalAlpha shading fix — GX_DECAL for correct
;;                             transparency vs legacy GX_MODULATE which is faster but wrong)
;;   speed_limiter  = on | off   (caps emulation at real-hardware 100% speed; off by default
;;                             since the SH4 thread normally runs uncapped — use this for
;;                             games that visibly run too fast on light frames. It is the
;;                             'too fast' half of the same schedule frameskip=auto uses for
;;                             its 'too slow' half, so pair the two to pin a game at 100%)
;;   render_delay   = off | on | flycast  (when the Dreamcast's graphics chip
;;                             reports "list received" and "picture finished".
;;                             Games that pace their main loop off these break
;;                             when they come instantly: speed reads >100%
;;                             while only a few frames per second render
;;                             (Marvel vs Capcom 2, "130% / 7 FPS"). flycast
;;                             (default, Flycast's rule): "picture finished"
;;                             comes later for bigger scenes, up to 1.5 million
;;                             SH4 cycles, so no per-game line should be
;;                             needed. on: the older fixed hardware-like
;;                             delays (also "list received" +200 cycles),
;;                             still used by the per-game lines below. off:
;;                             legacy, nearly instant.)
;;   jit_ici        = 0 | 1 | 2  (What a guest CCR.ICI write -- an SH4 I-cache
;;                             invalidate -- does to the compiled-code cache.
;;                             0 = clear the whole 6 MB cache, the legacy
;;                             default: always correct, free per frame, but
;;                             worth a ~10 ms recompile storm every time a game
;;                             invalidates (FRAME_PROF shows it as clr=1[ici]).
;;                             1 = ignore the invalidate. ONLY safe together
;;                             with jit_sbp=2; below that a game that really did
;;                             rewrite code will run the stale translation.
;;                             2 = ignore it AND force jit_sbp=2 for the run, so
;;                             the per-block guard covers what the clear used to.
;;                             2 is the combination worth A/B-ing and the one
;;                             that cannot be set half-way. NUMERIC: jit_ici=on
;;                             reads as 0 through atoi().
;;   jit_link_guard = on | off  (the first run of a block's static exit patches
;;                             it into a direct branch to the target. If the
;;                             code cache was cleared in between -- jit_ici=0,
;;                             or the cache filling up -- the target can be
;;                             compiled right on top of that old exit, and the
;;                             patch then breaks the new block: a freeze that
;;                             comes and goes when code layout changes. on
;;                             patches only an exit whose 3 instructions are
;;                             still the ones that asked. off still logs each
;;                             stale exit as [LINK] in /ndclog.txt, so off tells
;;                             you whether it happens at all. From the PS3 port
;;                             (fixed a Looney Tunes BIOS freeze there), not yet
;;                             tested on Wii. Default on.)
;;   jit_sbp        = 0 | 1 | 2  (JIT Stale Block Protection. Gates all defenses
;;                             against executing stale/self-modified SH4
;;                             translations: the boot-entry cache flush at the
;;                             IP.BIN -> game-binary transition, the runtime
;;                             block-check guard (re-checks the source byte at
;;                             block entry, 1 = known self-modifying addresses
;;                             like DOA2LE/Shenmue 1/2, 2 = every RAM block —
;;                             slow, diagnosis only), and the cache clear on a
;;                             guard failure. Default 1 (known). 0 reproduces
;;                             the legacy zero-protection behavior, for A/B
;;                             comparison only.)
;;   dma_fix        = on | off  (bundles the ch2/PVR/Sort/AICA-G2 DMA
;;                             correctness fixes ported from the verified-
;;                             working NullDC PSP port: correct CHCR TE/DE
;;                             writeback, no SB_C2DSTAT clobber, no bogus
;;                             PVR-DMA alignment check, the Sort-DMA link-
;;                             sentinel fix for WinCE games, and deferred
;;                             AICA G2-DMA completion + SB_E2ST. Default on.
;;                             off reproduces the legacy pre-fix behavior,
;;                             for A/B comparison only.)
;;   mmucr_fix      = 0 | 1 | 2  (read the SH4 MMU control register at its real
;;                             bits. Its bitfield is 4 bits short, so on the Wii
;;                             (big endian) the emulator never saw a game turn
;;                             the MMU on. Rez, Ikaruga, Sonic Shuffle and
;;                             Border Down do that to send their store-queue
;;                             writes through the TLB: the writes went to the
;;                             boot ROM instead of RAM, and the game stalled
;;                             after the BIOS logo. 1 = read the bits right
;;                             (the cause). 2 = 1 + the TLB rules that go with
;;                             it (a TLB flush keeps the store-queue map, an
;;                             invalid entry maps nothing, data array 2 gets
;;                             its own word); 2 is the set that fixed all four
;;                             games on PS3 hardware. Not yet tested on Wii.
;;                             Default 1. Also takes off/bits/full; on = 1.)
;;   cdi_hdr_fix    = on | off  (how a .cdi (DiscJuggler) image is opened. The
;;                             file ends with a pointer to its table of
;;                             contents. Only V3.5 images count that pointer
;;                             from the end of the file; V2 and V3 images count
;;                             it from the start. on (default) reads both right;
;;                             off (legacy) got V2 and V3 wrong, so those images
;;                             did not load at all (Crazy Taxi PAL is a V3 CDI).
;;                             V3.5 images load the same either way. /ndclog.txt
;;                             prints one
;;                             "[CDI] V3 header at ..." line per image. From
;;                             the PS3 port, not yet tested on Wii.)
;;   flash_broadcast = off | disc | ntsc  (the 50/60 Hz setting stored in your
;;                             dc_flash.bin. With a PAL flash most games run at
;;                             50 Hz on composite/RGB, which judders on a 60 Hz
;;                             Wii output. off: the flash decides (legacy).
;;                             disc (default): 60 Hz when the game's disc says Japan or
;;                             USA, 50 Hz when it says Europe only (GDI images
;;                             always count as 60 Hz). ntsc: always 60 Hz. The
;;                             flash file itself is not changed. Unlike cable=2
;;                             (VGA), no game refuses to boot over it. From the
;;                             PS3 port (Rayman 2 and CvS2 went from 50 to 60 Hz
;;                             there); not yet tested on Wii.)
;;   vertex_color = on | off  (real PVR Intensity/Gouraud shading: multiplies each
;;                             vertex's intensity by the polygon's FaceColor instead of
;;                             rendering flat grayscale — off by default elsewhere;
;;                             Crazy Taxi needs this for its HUD arrow/dollar sign color)
;;   pcw_list    = off | on | nozwrite  (honour a polygon's own PCW.ListType when
;;                             picking its blend state. This emulator files a polygon
;;                             into whatever list was open when it arrived, and a list
;;                             only opens after an End Of List parameter - so a game
;;                             that switches PCW.ListType without ending the previous
;;                             list gets its translucent polygons appended to the
;;                             OPAQUE list, where nothing ever calls GX_SetBlendMode.
;;                             An additive overlay then paints opaque black instead of
;;                             adding light. on = give such a polygon its own TSP
;;                             Src/Dst blend factors; nozwrite = also drop its depth
;;                             write. Needs blend_mode=on. off (default) = legacy.
;;                             Headhunter's menu panels need it.)
;;   tex_alpha       = on | off   (honour TSP.IgnoreTexAlpha, bit 19 of the TSP word.
;;                             On real hardware that bit REPLACES the texture alpha with
;;                             1.0, so the texel's own alpha bits are meaningless and the
;;                             artist usually leaves them at 0. This renderer read them
;;                             anyway: TEV stage 0 is a plain modulate, so alpha 0 reached
;;                             the blender and a SrcAlpha/One translucent surface added
;;                             nothing at all - it rendered as whatever was behind it,
;;                             i.e. black. on = alpha comes from the vertex (ModulateAlpha
;;                             / DecalAlpha) or is pinned to 1.0 (Modulate / Decal), and
;;                             the ARGB1555 force-opaque hack is skipped for those polys.
;;                             off (default) = legacy. Headhunter's panels need it.)
;;   blend_mode      = on | off   (per-polygon TSP SrcInstr/DstInstr blending for the
;;                             translucent list — on applies the polygon's actual blend
;;                             factors each frame (correct); off skips the override and
;;                             uses the GX default (legacy, but wrong for RE3))
;;   rgb565_opaque_alpha = on | off  (force vertex alpha opaque for RGB565 (fmt1) textures.
;;                             on (default): both ARGB1555 (fmt0) and RGB565 (fmt1) force
;;                             vertex alpha to 0xFF, matching existing behavior.
;;                             off: only ARGB1555 (fmt0) is forced opaque; RGB565 (fmt1)
;;                             uses vertex alpha as-is, allowing translucent RGB565 polys)
;;   fps_boost       = on | off  (only takes effect when blend_mode=on. on skips the
;;                             alpha-test/ZCompLoc pass for every polygon outside the
;;                             translucent list, gaining a couple of FPS (e.g. Castlevania)
;;                             at the cost of incorrect alpha on some opaque/punch-through
;;                             polys. Default off (correct alpha).)
;;   trans_sort      = on | off  (translucent depth sort. Real PVR autosorts translucent
;;                             pixels in hardware; on sorts the translucent strips
;;                             back-to-front before drawing, fixing wrong overlaps in
;;                             alpha-heavy scenes at some CPU cost per frame.
;;                             Default off (legacy submission-order draw).)
;;   autosort        = 0 | 1 | 2 | 3 | 4  (REAL per-pixel PVR autosort via GX depth
;;                             peeling — stronger than trans_sort's per-strip
;;                             painter sort, for intersecting/interleaved
;;                             translucent geometry. Value is the max translucent
;;                             depth LAYERS composited per pixel; each layer costs
;;                             ~2 extra walks of the translucent geometry + 2 EFB Z
;;                             copies, so use 2 or 3 only where needed. Overrides
;;                             trans_sort; layer_sort overrides it. Best paired
;;                             with punch_through=on. 0 (default): off.)
;;   punch_through   = on | off  (punch-through list fix. on (default): draws lists
;;                             in OP -> PT -> TR order with the PT list alpha-tested
;;                             against PT_ALPHA_REF and blending off, like real PVR.
;;                             off (legacy): PT polys drawn last, in the translucent
;;                             blend state.)
;;   offset_color    = on | off  (offset/specular color. on: textured polys render as
;;                             PIX = base*tex + offset like real PVR (specular
;;                             highlights on cars/water), costing 4 bytes/vertex of
;;                             FIFO + a second TEV stage on offset polys. off
;;                             (default): offset color dropped, legacy.)
;;   render_to_texture = on | off | overlay | keep  (render-to-texture. Frames whose write
;;                             address (FB_W_SOF1) has bit 24 set target the 64-bit
;;                             texture area — mirrors, TV screens, sniper scopes,
;;                             some menu effects. on:
;;                             renders them and copies the EFB back into emulated
;;                             VRAM so the game can bind the result as a texture, at
;;                             the cost of an EFB copy + CPU convert per RTT frame.
;;                             keep: "on" PLUS the render does not consume the TA
;;                             list. On real hardware a render never does — the
;;                             ISP/TSP just walk the tile arrays, which stay valid
;;                             until TA_LIST_INIT — so a game may render ONE
;;                             accumulated list twice with different write
;;                             addresses and clip windows. Silent Scope's sniper
;;                             scope is built that way: one list holds the scope
;;                             disc plus the 24x-magnified world, it is rendered
;;                             first into a 256x256 texture (clip 0..255), then the
;;                             ordinary world is appended and the WHOLE list is
;;                             rendered to the screen. With plain "on" the reset
;;                             after the texture pass throws the first half away
;;                             and the scope disc never appears. Pair with
;;                             split_screen=on so the magnified half stays inside
;;                             its user tile clip instead of covering the screen.
;;                             overlay: does NOT resolve a texture — instead the
;;                             pass's geometry is carried into the next display
;;                             frame and drawn last, flat on top (parked on the near
;;                             plane, GX_ALWAYS, no Z-write), with its own OP/TR/PT
;;                             list boundaries replayed. Use it when "on" gives
;;                             nothing and the pass is really an overlay the game
;;                             composites itself — Silent Scope's sniper crosshair.
;;                             off (default): those frames are dropped — but their
;;                             geometry is left in the vertex buffers, so it leaks
;;                             into the next frame, drawn first, misclassified as
;;                             opaque, and mostly overdrawn by the scene. That leak
;;                             is why some overlays half-show with RTT off; overlay
;;                             is the same idea done deliberately.)
;;   yuv_stride = off | auto | always | texctl  (how the REAL per-row pixel pitch of a
;;                             YUV422 source is decided. A YUV422 texture is
;;                             declared at a power-of-two size, but an FMV frame
;;                             written by the YUV converter is packed at the
;;                             video's native width (e.g. 320) with no padding,
;;                             so decoding it at the declared width slices the
;;                             picture into repeated strips.
;;                             auto (default): use the real pitch only for a
;;                             texture the YUV converter actually wrote, which
;;                             is what fixed Bomberman's intro, Test Drive 6 and
;;                             Dino Crisis.
;;                             always: the old behaviour - take the pitch from
;;                             the TA_YUV_TEX_CTRL register for EVERY YUV422
;;                             texture. That register belongs to the converter
;;                             and says nothing about a texture the game
;;                             uploaded itself: a game that never programs it
;;                             leaves it at 0, which decodes as 16x16 and blanks
;;                             the texture - Soul Calibur's character select went
;;                             mostly black.
;;                             texctl: auto, plus the actual hardware rule as a
;;                             fallback for the surfaces auto's converter
;;                             tracking never saw (it only remembers 4 base
;;                             addresses, so a game cycling more FMV buffers
;;                             than that falls through). TCW.StrideSel means the
;;                             rows are packed at TEXT_CONTROL[4:0] x 32 texels;
;;                             that is a SOURCE PITCH and is applied as one -
;;                             the declared width is left alone, because every
;;                             UV in the strip is relative to it and rewriting
;;                             it re-slices the picture rather than unslicing
;;                             it. texctl also fixes the planar RGB path, which
;;                             still guesses a blind 512 under every other mode.
;;                             If a movie is still messy under auto, try texctl
;;                             before always.
;;                             off: always decode at the declared width.)
;;   yuv_twiddle_fix = on | off  (fixes TWIDDLED YUV422 textures — static YUV
;;                             artwork, NOT movie playback. The legacy decoder
;;                             swapped the two u16 halves of each source u32 and
;;                             read luma from the low byte / chroma from the high
;;                             byte, so luma and chroma traded places and the
;;                             picture collapsed onto a green<->magenta duotone
;;                             with 1-column striping. Turn on for any game whose
;;                             YUV artwork comes out green — Virtua Fighter 3tb's
;;                             "FIRST MATCH" loading screen is the reference case.
;;                             Real FMV is planar and is not affected either way.
;;                             Default off.)
;;   seam_fix        = on | off  (half-texel UV inset via a per-texture GX matrix.
;;                             Stops GX_LINEAR from sampling past a sprite's own
;;                             texels, killing the thin black seam line between 2D
;;                             tiles/sprites without dropping to GX_NEAR — keeps
;;                             wrap/tiling intact. Default off.)
;;   fog             = on | off  (per-polygon PVR2 fog. Honours each polygon's
;;                             TSP.FogCtrl: look-up table (FOG_TABLE/FOG_DENSITY,
;;                             colour FOG_COL_RAM), per-vertex (coefficient = the
;;                             vertex's offset-colour alpha, colour FOG_COL_VERT),
;;                             no fog, and LUT mode 2. The coefficient is worked
;;                             out per vertex on the CPU and blended by one extra
;;                             TEV stage, so foggy games get their distance haze
;;                             back instead of hard geometry that pops in at the
;;                             draw distance — racers and outdoor games above all.
;;                             Costs 4 bytes/vertex and one TEV stage on fogged
;;                             polygons only. Default off.)
;;   fog_index       = on | off  (only matters with fog=on. on (default): the
;;                             fog amount follows distance the way the Dreamcast
;;                             computes it. off (legacy): it was computed the
;;                             wrong way round, so most of a scene got the
;;                             table's last value -- too much or no fog at all.)
;;   x_scaler        = on | off  (PVR horizontal X-scaler support. A few games
;;                             (Omicron The Nomad Soul, Wacky Races) render the
;;                             scene 1280 pixels wide and let the PVR video
;;                             scaler halve it 2:1 on framebuffer write
;;                             (horizontal SSAA). on widens the projected
;;                             canvas to 1280 so the whole scene shows; off
;;                             (default, legacy) keeps a 640 canvas, showing
;;                             only the LEFT HALF of the image in those games.)
;;   y_scaler        = on | off  (PVR vertical Y-scaler support - the other half
;;                             of the same register x_scaler reads.
;;                             SCALER_CTL.vscalefactor is 6.10 fixed point
;;                             (0x400 = 1.0): above 1.0 the CORE renders the
;;                             scene that many times TALLER and the video
;;                             scaler shrinks it back on framebuffer write
;;                             (vertical SSAA / flicker filter), below 1.0 it
;;                             renders shorter and the scaler stretches. on
;;                             scales the projected canvas height by that
;;                             factor so the whole scene shows; off (default,
;;                             legacy) ignores it, showing only a SLICE of the
;;                             image in those games.)
;;   h_scaler        = on | off  (PVR horizontal H-scaler at video output:
;;                             VO_CONTROL.pixel_double. In the low-res video
;;                             modes the framebuffer holds a HALF-width (320)
;;                             image and the video DAC emits every pixel twice
;;                             to fill the 640-pixel line, so the scene is
;;                             drawn in a 320-wide screen space. on halves the
;;                             canvas to match; off (default, legacy) projects
;;                             it into a 640 canvas where it fills only the
;;                             LEFT HALF. Register-driven counterpart of
;;                             canvas_width below, which stays the manual
;;                             override for games that render narrow WITHOUT
;;                             setting the bit - an explicit canvas_width
;;                             wins over this.)
;;   canvas_width    = 0 | 320..1280  (forced canvas width for 240p modes.
;;                             Some low-res games draw their scene narrower
;;                             than 640 and pad the rest with black filler,
;;                             so neither registers nor measurement reveal
;;                             the real width. This forces it, only while
;;                             the video mode is non-interlaced NTSC/PAL
;;                             (240p) — interlaced boot/logo screens keep
;;                             the 640 canvas. Street Fighter III / Double
;;                             Impact: 384 (CPS3 arcade width). 0 (default):
;;                             off.)
;;   split_screen    = off | on (=tile_clip) | multipass | both  (split-screen
;;                             multiplayer. The Dreamcast has TWO ways to confine a
;;                             player's camera to its half of the screen and games
;;                             pick either one, so this key carries both.
;;                             on / tile_clip: both viewports arrive in ONE render
;;                             pass, each player's polygons carrying a PVR User Tile
;;                             Clip rect (Daytona USA, confirmed). Without it the two
;;                             cameras draw fullscreen on top of each other and you
;;                             mostly see player 1.
;;                             multipass: the game issues ONE RENDER_START PER
;;                             VIEWPORT into the same framebuffer, each restricted to
;;                             its band of it. Legacy presents every one of those as a
;;                             finished frame, so the display alternates player 1 /
;;                             player 2 / player 1 — HEAVY FLICKER. Try this whenever a
;;                             2P split screen flickers rather than showing one camera
;;                             (Le Mans 24 Hours, Demolition Racer, Magical Racing
;;                             Tour). Each partial pass is drawn into its own band of
;;                             the EFB and ONE assembled frame is presented.
;;                             both: per-poly tile clips inside multi-pass renders.
;;                             Default off (legacy).)
;;   mipmap          = off | fast | trilinear  (GX mipmap generation. off (default):
;;                             legacy base-level-only, fastest. fast: generated mip
;;                             chain sampled with nearest-mip bilinear — cuts distant
;;                             shimmer at near-zero GPU cost. trilinear: best quality
;;                             but takes 2 texture cycles/texel on Hollywood, halving
;;                             texture fill rate — e.g. -40% FPS in Test Drive 6.)
;;   fixed_depth     = 0 | 1 | 2  (fixed depth projection. 0 (default): legacy
;;                             per-vertex min/max W tracking, fits the Z range to
;;                             the scene each frame. 1 (wide): skips that tracking,
;;                             fixed planes W=[0.0001..100000] — safe everywhere,
;;                             coarser Z (more Z-fighting risk). 2 (tight): fixed
;;                             planes W=[0.1..25000] — much finer Z, but geometry
;;                             outside that range clips. UNVERIFIED on real
;;                             hardware — test per-game before relying on it.)
;;   legacy_depth    = on | off  (off by default. Reproduces the depth pipeline
;;                             exactly as it stood at commit 1bb8c27, the last
;;                             state known to render certain games correctly.
;;                             Three things differ from today and all three are
;;                             restored together: fixed planes NEAR=0.001 and
;;                             FAR=10000*1.001; vert_base clamps 1/W at 0.001
;;                             instead of 0.0001; and no per-vertex min/max
;;                             tracking or margin/HUD vertex fixups. The clamp is
;;                             the part fixed_depth cannot express, which is why
;;                             no fixed_depth value reproduces 1bb8c27.
;;                             Overrides fixed_depth.)
;;   depth_clip      = 0 | 1 | 2  (real-Wii Z-clip workaround. Dolphin never
;;                             Z-clips (it clamps), so geometry sitting on or
;;                             beyond the near/far plane — often the 2D UI,
;;                             which defines the dynamic near plane itself —
;;                             shows in Dolphin but vanishes on real hardware.
;;                             0 (default): legacy, XF clipping on, no margin.
;;                             1 (near margin): pads the near plane by 0.1% so
;;                             the nearest layer can't land exactly on it —
;;                             CONFIRMED on real Wii hardware, fixes ChuChu
;;                             Rocket and Crazy Taxi menu/intro with no
;;                             downside seen so far. 2 (no clip): disables XF
;;                             clipping entirely to fully match Dolphin —
;;                             regressed Crazy Taxi when combined with
;;                             fixed_depth=2 (tight), avoid that combo.)
;;   hud_pass        = 0 | 1 | 2  (rescue the 2D HUD that fixed_depth=tight clips.
;;                             0 (default): legacy. Any strip sitting nearer than
;;                             the projection near plane (the HUD, which parks in
;;                             front of the tight W=0.1 plane) is re-parked onto
;;                             the plane with its screen position preserved and
;;                             drawn GX_ALWAYS. 1 = overlay (no Z-write): the HUD
;;                             may be overdrawn by geometry drawn after it. 2 =
;;                             protect (Z-write at the near plane): later scene
;;                             polys fail GEQUAL over HUD pixels so it stays on
;;                             top — use this if mode 1 leaves polys in front of
;;                             the HUD; avoid on games with a large near-clipped
;;                             quad drawn early. Companion to fixed_depth=2 — a
;;                             no-op on its own (dynamic/wide ranges never clip
;;                             the HUD). Fixes the "Z-fighting gone but HUD
;;                             vanished" case in Rayman 2 / Cannon Spike.
;;                             UNVERIFIED on real hardware — test per-game.)
;;   async_render    = on | off  (async GPU present. off (default): CPU blocks in
;;                             GX_DrawDone() until the GPU finishes each frame.
;;                             on: queues the frame and returns at once — the
;;                             SH4 core emulates the next frame while the GPU
;;                             draws, and the finished frame is presented at
;;                             the start of the next one. One frame of extra
;;                             display latency; large FPS gain whenever the
;;                             GPU takes a meaningful slice of the frame.
;;                             UNVERIFIED on real hardware — test per-game.)
;;   show_fps        = on | off  (gameplay FPS/speed text overlay, drawn straight to
;;                             the XFB by the software overlay in gxRend.cpp. off
;;                             (default): no overlay. on: shows live FPS + speed%.)
;;   tmem_cache      = on | off  (persistent GPU texture cache. off (default):
;;                             invalidates the GPU's 1MB texture cache (TMEM)
;;                             every frame, re-fetching every texel from RAM.
;;                             on: invalidates only when a texture is actually
;;                             re-decoded, so unchanged textures stay cached
;;                             across frames — more texture fill rate.
;;                             UNVERIFIED on real hardware — test per-game.)
;;   cdda            = on | off  (CD audio (Red Book) music. off (default): the
;;                             AICA EXTS0 input stays silent, so games that
;;                             play music as CD audio tracks have no music.
;;                             on: streams the playing track's sectors from the
;;                             disc image (~75 reads/s) into the sound mix.
;;                             UNVERIFIED on real hardware — test per-game.)
;;   cdda_pause_fix  = on | off  (what a game's "pause CD audio" command does.
;;                             off (legacy): the drive jumps back to the start
;;                             of the disc, so music resumed after a pause
;;                             restarts from the beginning or stays silent.
;;                             on (default): it only pauses and keeps its
;;                             place, as on a real Dreamcast. From the PS3 port, where it fixed
;;                             the music after a pause in ChuChu Rocket and
;;                             Looney Tunes Space Race; not yet tested on Wii.)
;;   cdda_state_fix  = on | off  (CD music behaves like the real drive's. on
;;                             (default): the drive knows "playing", "paused"
;;                             and "finished"; resuming only continues a paused
;;                             track, loading game data stops the music (a real
;;                             drive cannot do both), and a track that reaches
;;                             its end reports it. off (legacy): music could
;;                             keep playing during loads or restart on a resume.)
;;   mute_pcm16      = on | off  (silence 16-bit PCM channels. off (default): all
;;                             sample formats play normally. on: any AICA channel
;;                             whose PCMS==0 (16-bit PCM) is dropped at KEY_ON — a
;;                             workaround for ChuChu Rocket's echoey/slow-motion
;;                             16-bit SFX. Also mutes 16-bit music/voices, so this
;;                             is a per-game hack, not a general fix. Superseded
;;                             for ChuChu by arm7_str_align, the real cause.)
;;   arm7_str_align  = on | off  (an ARM7 sound-CPU word store to an address that
;;                             is not a multiple of 4. on (default): writes the
;;                             aligned word, as the real chip does. off: the
;;                             old code spread the 4 bytes over two words and
;;                             corrupted both. ChuChu Rocket's sound driver does
;;                             that ~2000 times a second, which is what made its
;;                             effects slow, long and echoing. Lines starting
;;                             [ARM7] unaligned STR in /ndclog.txt show whether
;;                             a game takes this path at all. From the PS3 port,
;;                             fixed there; not yet tested on Wii.)
;;   arm7_reset_fix  = on | off  (what a reset of the sound CPU leaves behind.
;;                             on (default): it starts in the mode the real
;;                             chip has (SVC) and forgets any interrupt that was
;;                             waiting, as Flycast does. off (legacy): it
;;                             started in a mode that chip does not have, and a
;;                             stale interrupt could fire into the new sound
;;                             driver. From the PS3 port (Looney Tunes sound
;;                             group); not yet tested on Wii.)
;;   aica_race       = on | off  (Flycast's timing rules between the sound chip
;;                             and the main CPU: when a sound-RAM DMA counts as
;;                             finished, a DMA started twice, interrupt masks
;;                             taking effect right away, and the sound CPU
;;                             running a few more cycles after it signals the
;;                             main CPU. on (default); off = legacy. From the
;;                             PS3 port, where this group fixed Looney Tunes
;;                             Space Race's sound effects; not yet tested on Wii.)
;;   aica_ca_clamp   = on | off  (GAME WORKAROUND, off by default: a game reading
;;                             a sound's play position never sees the last 3
;;                             samples of the loop. Flycast added it for some
;;                             Visual Concepts sports games; the real chip does
;;                             not do this. Turn it on only in the section of a
;;                             game that needs it.)
;;   aica_fast       = on | off  (cheaper AICA sound mixer, same output samples.
;;                             on (default): only playing channels are visited
;;                             (not all 64 every sample), the empty
;;                             filter-envelope call is skipped, no DSP send
;;                             while the DSP is off, master volume is cached,
;;                             silent CD-audio is skipped. Wii-CONFIRMED
;;                             2026-09-13: aica% 10.0->7.7, speed +2.6%, no
;;                             audible change. off: legacy mixer.)
;;   adpcm_loop      = on | off  (how a looping ADPCM sound effect starts its
;;                             next lap. off (legacy): the decoder starts each
;;                             lap from scratch, so a loop that does not start
;;                             at the very beginning of its sample comes out far
;;                             too quiet after the first lap (Sonic Adventure 2:
;;                             held effects fade to near silence after ~1 s).
;;                             on (default): each lap starts from the state the
;;                             first pass had there, as the real chip does. Sounds
;;                             whose loop starts at 0 are the same either way.
;;                             From the PS3 port, not yet tested on Wii.)
;;   vtx_alpha       = on | off  (vertex alpha on ARGB1555 surfaces.
;;                             off (default): legacy — vertex alpha is forced to
;;                             0xFF on EVERY ARGB1555 polygon whatever
;;                             TSP.UseAlpha says. That is a deliberate hack for
;;                             ARGB1555 cutout fonts (Test Drive 6) where games
;;                             leave vertex alpha at 0 and let the TEXTURE alpha
;;                             gate visibility.
;;                             on: honour TSP.UseAlpha and nothing else, i.e. the
;;                             hardware's own rule. Needed by anything that FADES
;;                             via vertex alpha on an ARGB1555 surface: that
;;                             format has only 1 bit of texture alpha, so the fade
;;                             has to live in the 8-bit vertex / sprite-header
;;                             alpha, and forcing it opaque pins the overlay on
;;                             screen forever. Fighting Vipers 2's SEGA screen is
;;                             exactly this — a full-screen fade overlay that
;;                             covered everything behind it.
;;                             Pair it with sprite_color for sprite-based fades.)
;;   list_order      = on | off  (PVR list-type render order, not TA order.
;;                             Real PVR2 sorts every polygon into a per-tile
;;                             OPAQUE / PUNCH-THROUGH / TRANSLUCENT list and
;;                             renders them OP -> PT -> TR, whatever order the
;;                             game handed the lists to the TA. This renderer
;;                             keeps one flat strip buffer walked in SUBMISSION
;;                             order, which quietly assumes the game submits its
;;                             opaque list first. A game that opens the
;;                             translucent list FIRST and its opaque list after
;;                             gets its opaque geometry drawn LAST, painting over
;;                             the whole scene.
;;                             off (default): legacy submission-order walk.
;;                             on: when the opaque list opened after the
;;                             translucent one, its range is drawn first, as the
;;                             hardware would. Bit-identical to off for every
;;                             game that submits OP first (the condition never
;;                             fires), so it is only worth setting on a game that
;;                             shows this symptom: gameplay visible for a moment,
;;                             then a big background image covering everything.
;;                             Puyo Puyo 4 / Puyo Puyo DA! does exactly that --
;;                             its two full-screen background plates go out in the
;;                             OPAQUE list after the gameplay sprites.)
;;   layer_back_tex  = 0 | <addr>[,<addr>...]  (name up to 4 textures as
;;                             BACKDROPS, not overlays. For a 2D game that submits its playfield
;;                             backdrop LATE in the translucent list, at the same
;;                             depth as the sprites already standing in it:
;;                             painter order then paints the backdrop over its
;;                             own contents, and because it is alpha-blended the
;;                             sprites do not vanish, they just go DIM.
;;                             Symptom: "the sprites are not bright enough, I can
;;                             see them behind the translucent background".
;;                             Give it the texture's VRAM address (hex or
;;                             decimal, from a [SCN] census addr= field) and its
;;                             strips sort behind every other one at that depth.
;;                             Find the address with debug_skip_tex: hide one
;;                             texture at a time and see what stops being
;;                             covered. Puyo Puyo 4 = 0x118000, its two
;;                             playfields. 0 = off (default).
;;                             A COMMA LIST names more than one, which a game
;;                             with more than one backdrop needs (a menu screen
;;                             and a gameplay screen rarely share a plate):
;;                               layer_back_tex=0x118000,0x054000
;;                             Up to 4; a bare address is still valid, it is a
;;                             list of one. This is the general, cfg-only
;;                             mechanism -- a per-game hack with hardcoded
;;                             addresses (Puyo Puyo 4's own two, matching the
;;                             example above) lives entirely in gxRend.cpp
;;                             instead, behind its own `puyo_hack` on/off
;;                             switch (also a page-6 menu row), so the SD card
;;                             never needs touching to use it. This key and
;;                             that switch both feed the same address list and
;;                             happily combine if both are set.
;;                             Implies the translucent sort. Address-keyed on
;;                             purpose: at one shared depth there is no depth to
;;                             sort on and a backdrop is indistinguishable from
;;                             an ordinary sprite by blend/format/size, so a
;;                             heuristic cannot find it -- see the long
;;                             Hokuto no Ken v1..v11 history for what guessing a
;;                             signature costs.)
;;   layer_front_tex = 0 | <addr>[,<addr>...]  (the exact MIRROR of
;;                             layer_back_tex above: name up to 4 textures as
;;                             OVERLAYS, drawn on top of everything else in the
;;                             translucent list.
;;                             Same 2D failure mode read the other way round.
;;                             A HUD plate, score panel or the frame around the
;;                             playfield goes out EARLY in the translucent list,
;;                             at the same depth as the sprites that follow it,
;;                             so painter order paints the sprites over it.
;;                             Symptom: "the interface is behind the characters",
;;                             "the panel is half-eaten by the sprites", "the
;;                             frame disappears where a character walks past".
;;                             Give it the texture's VRAM address (hex or
;;                             decimal, from a [SCN] census addr= field, found
;;                             with debug_skip_tex exactly like the backdrop
;;                             case) and its strips draw last. 0 = off (default).
;;                             A COMMA LIST names up to 4:
;;                               layer_front_tex=0x52C000,0x694000
;;                             Two deliberate differences from layer_back_tex:
;;                             (1) a front match wins OUTRIGHT, not only against
;;                             strips at the same depth -- a backdrop that is
;;                             genuinely farther away already sorts right, but
;;                             "on top" gets no such luck, so front strips are
;;                             pinned after everything else whatever their W;
;;                             (2) they are drawn with the depth test defeated
;;                             (GX_ALWAYS, no Z-write), because being issued
;;                             last does not help an overlay the depth buffer
;;                             rejects. Net statement: this texture goes on top,
;;                             nothing hides it, and it hides nothing after it.
;;                             Implies the translucent sort. TRANSLUCENT LIST
;;                             ONLY -- a texture the game draws in the opaque or
;;                             punch-through list is not in this sort's range,
;;                             and naming it here does nothing (use list_order
;;                             for a whole list submitted in the wrong order).
;;                             Address-keyed for the same reason as the backdrop
;;                             key: at one shared depth an overlay is
;;                             indistinguishable from an ordinary sprite by
;;                             blend/format/size, so no heuristic finds it.)
;;   sprite_color    = on | off  (honour a Sprite's Base Colour.
;;                             A Sprite (PCW.ParaType 5) has no per-vertex
;;                             colour: its header carries ONE packed Base Colour
;;                             for all four corners. The renderer hardcoded white
;;                             and discarded that field, so EVERY sprite in EVERY
;;                             game drew with white vertex colour. With
;;                             TSP.ShadInstr = ModulateAlpha (colour = texture x
;;                             vertex) a black sprite then comes out white.
;;                             Found on Fighting Vipers 2's SEGA screen: the
;;                             full-screen black backdrop is a sprite, and it was
;;                             drawing as a white plate over the whole display.
;;                             on (DEFAULT): reading the field is simply
;;                             correct, and discarding it was silently wrong for
;;                             every sprite in every game. Set it off per-game
;;                             only if some title turns out to depend on the old
;;                             white -- if that becomes common this wants an
;;                             auto rule rather than a switch.)
;;   trans_zwrite    = on | off  (DEBUG ONLY. depth WRITE for the translucent
;;                             on (default): legacy — the TR list inherits the
;;                             frame-wide GEQUAL compare WITH depth write, so the
;;                             first translucent strip submitted at a near depth
;;                             stamps the Z buffer and depth-rejects every farther
;;                             translucent strip behind it. One near full-screen
;;                             quad can hide the entire rest of the list.
;;                             off: keep the depth TEST (opaque geometry still
;;                             occludes translucent geometry behind it) but drop
;;                             the write, so translucent strips composite in
;;                             submission order.
;;                             DEBUG ONLY: off HIDES the Dreamcast BIOS boot
;;                             logo, which needs the depth ordering this
;;                             removes. Written for Fighting Vipers 2's SEGA
;;                             screen and it was not the fix there either (that
;;                             was sprite_color + vtx_alpha), so it survives
;;                             purely as an investigation tool for the next
;;                             scene where translucent strips wrongly occlude
;;                             each other. An auto mode keyed on ISP_FEED_CFG
;;                             was tried and removed: nothing writes that
;;                             register, so it read 0 everywhere and behaved
;;                             exactly like on.)
;;   bg_poly         = on | off  (background polygon rendering. ISP_BACKGND_T's
;;                             3 vertices are normally only used for the EFB
;;                             clear color. on additionally barycentric-
;;                             extrapolates them into a full-screen textured/
;;                             Gouraud quad — needed by Who Wants to Be a
;;                             Millionaire's background — at the cost of an
;;                             extra texture bind + polygon draw every frame.
;;                             off (default): legacy, draws nothing extra.
;;                             Caused an FPS regression in other games when
;;                             left unconditionally on — enable per-game only.)
;;   layer_sort      = on | off  (layer-tiered translucent sort for 2D games
;;                             that submit the whole scene at ONE depth and
;;                             rely on PVR per-pixel autosort. Activates the
;;                             trans_sort machinery (implied, no need to set
;;                             trans_sort=on) and adds a tie tier at equal
;;                             depth: full-screen untextured REPLACE plates
;;                             draw first (background plates the game
;;                             expects autosort to bury), then VQ stage art
;;                             (ALL VQ — splitting VQ by address broke the
;;                             char select screen, keep VQ order legacy),
;;                             then 8bpp sprites on palette bank 32-47
;;                             (stage crowd), then everything else in
;;                             submission order — the backdrop can't erase
;;                             the fighters, while high-VRAM foreground VQ
;;                             (super auras, cut-ins, intro dust) and
;;                             fades/HUD keep painter compositing. Only the
;;                             full-screen plate tier is scene-gated (80+
;;                             VQ strips = battle); the VQ and crowd tiers
;;                             stay on unconditionally — gating those too
;;                             was tried and broke char select/
;;                             presentation (disabling crowd moved it into
;;                             the topmost tier instead of a neutral one).
;;                             Every tier is chosen from RENDER STATE only,
;;                             so this is game-agnostic — SF3 uses it too.
;;                             Was called hokuto_hack before 0.66; that name
;;                             now means the address hack below only.
;;                             off (default): submission order only —
;;                             Hokuto no Ken's backdrop covered its
;;                             fighters that way.)
;;   hokuto_hack     = on | off  (Hokuto no Ken ONLY. Refines the layer_sort
;;                             tier of VQ stage art using that game's own
;;                             hardcoded VRAM texture addresses: its stage 1
;;                             and 2 debris tiles are pushed behind the rest
;;                             of the tier, and one tile that must never be
;;                             visible is pushed behind everything. Those
;;                             tiles cannot be told apart from the fighters
;;                             by format + blend alone, which is why they are
;;                             keyed by address instead. Needs layer_sort=on
;;                             — on its own it does nothing — and the address
;;                             list is per-game AND per-scene, so leave it
;;                             off everywhere else. off (default).)
;;   puyo_hack       = on | off  (Puyo Puyo 4 ONLY. Folds that game's own two
;;                             hardcoded backdrop VRAM addresses into
;;                             layer_back_tex's tier-4 sort: the gameplay
;;                             playfields (puyos go dim behind the grid) and
;;                             the intro/main screen background (fading
;;                             UI/logo pieces get buried under it) — two
;;                             unrelated screens, same bug shape. Addresses
;;                             live in gxRend.cpp, not in this file; combines
;;                             with an explicit layer_back_tex list if one is
;;                             also set. Also a page-6 menu row, specifically
;;                             so this fix works without touching the cfg at
;;                             all (e.g. from inside Dolphin, where the SD
;;                             card isn't easy to edit). off (default).)
;;   isp_depth_func  = 0 | 1 | 2  (per-polygon isp.DepthMode -> GX depth
;;                             compare. DIFFERENT from layer_sort above: this
;;                             honors each polygon's actual DepthMode register
;;                             instead of the fixed GEQUAL painter compare.
;;                             0=off (legacy), 1=honor DepthMode on the
;;                             opaque/PT lists only (translucent stays GEQUAL,
;;                             matching real PVR autosort), 2=all lists.
;;                             Experimental — off by default.)
;;   isp_cull        = 0 | 1 | 2  (per-polygon isp.CullMode -> GX backface
;;                             culling. 0=off (legacy: never cull), 1=on,
;;                             2=on with the two cullable windings swapped
;;                             (use if 1 makes geometry vanish / look
;;                             inside-out). Experimental — off by default.)
;;   subpass_zclear  = on | off  (sub-pass depth-only Z clear. Re-parks the whole
;;                             Z buffer at a known W via a full-canvas GX_ALWAYS
;;                             quad, without touching color, so a geometry group
;;                             drawn right after (e.g. a hud_pass=2 PROTECT-mode
;;                             overlay) starts from a clean depth baseline
;;                             instead of whatever the main scene left behind.
;;                             off (default): single shared depth pass, legacy.
;;                             on: re-park before that later pass — opt-in
;;                             per-game.)
;;   poly_offset     = 0 | 1 | 2 | 3  (native polygon offset / Z bias tier,
;;                             applied to the Punch-Through list. Real hardware
;;                             has no glPolygonOffset register; this uses a
;;                             Z-texture in ADD mode (GX_SetZTexture) to add a
;;                             constant depth bias to every fragment, for
;;                             co-planar decals/shadows/road-markings that
;;                             PVR's tile order used to sort for free. 0
;;                             (default): off, legacy. 1..3: increasing bias
;;                             strength.)
;;   audio_buffers   = 0 .. 8 | default  (forces
;;                             settings.emulator.AudioBuffers, the depth of
;;                             the audio ring — see nullDC.cpp
;;                             LoadSettings() and wii/wii_audio.cpp. 0:
;;                             free-run, audio never paces emulation and a
;;                             block is dropped when the ring is full. For a
;;                             game that cannot reach 100%, pair 0 with
;;                             audio_drc=3: the output is retuned to the rate
;;                             the game actually produces instead of
;;                             crackling, and no frames are given up.
;;                             1..8: the emulation thread blocks only once N
;;                             blocks are already queued, so it works ahead
;;                             into the free slots instead of stopping dead
;;                             at every block boundary. 1 reproduces the old
;;                             single-buffer behaviour and has no slack at
;;                             all; 4 is the recommended starting point.
;;                             Pacing is a speed limiter by construction:
;;                             ASND accepts one block per 21.333 ms tick, so
;;                             sustained speed is capped at
;;                             audio_block/940.8 of real time.
;;                             default (alias: auto, saved): explicitly
;;                             resets it to the saved/cfg value, undoing a
;;                             [default] section override or a previous
;;                             game's setting from earlier this boot.
;;                             Leaving the key out of a section entirely
;;                             does the same thing UNLESS an earlier section
;;                             already forced it — 'default' guarantees the
;;                             reset regardless of what ran before.)
;;   audio_block     = 0 | 1 | 2  (samples per ASND buffer. 0 (default):
;;                             1024 = 23 ms, caps paced emulation at 109% of
;;                             real speed. 1: 1536 = 35 ms, 163%. 2: 2048 =
;;                             46 ms, 218%. Bigger blocks give the ring more
;;                             slack and raise the pacing ceiling, at the
;;                             cost of output latency. Nothing below 944
;;                             samples is accepted: ASND takes at most one
;;                             buffer per 21.333 ms tick, so a shorter block
;;                             cannot keep a 44.1 kHz voice fed no matter
;;                             what else is set — that is why the old
;;                             735-sample buffer crackled at every setting.)
;;   audio_drc       = 0 | 1 | 2 | 3  (dynamic rate control: trims the ASND
;;                             playback pitch to hold the ring near half
;;                             full, so a game sitting slightly off real
;;                             speed plays clean instead of crackling.
;;                             0 (default): off. 1: +-1%, inaudible, absorbs
;;                             jitter. 2: +-3%. 3: +-15%, follows a game
;;                             well off 100% but is audibly detuned.)
;;   audio_stats     = on | off  (one [WiiAudio] line per second to
;;                             /ndclog.txt: blocks, underruns, drops, pacing
;;                             waits, ring level, live pitch. Tells an
;;                             underrun — ring empty, emulation too slow —
;;                             from a drop — ring full, emulation too fast —
;;                             before you change anything else. Default off.)
;;   sh4_clock       = 150..200  (SH4 underclock — effective SH4 core clock in
;;                             MHz, clamped to [150,200]. 200 (default) is
;;                             real-Dreamcast full speed. Lower values budget
;;                             fewer emulated SH4 cycles per audio/video/RTC
;;                             frame, so the Wii renders more frames per second
;;                             (smoother), at the cost of the emulated machine
;;                             acting like a slower Dreamcast — CPU-heavy games
;;                             drop internal frames. Audio stays in sync. A
;;                             pure performance knob — test per game.)
;;   arm7_speed      = 0 | 1 | 2  (ARM7 sound-CPU speed divider stage. Effective
;;                             clock = ~10 MHz >> stage. The AICA driver free-runs
;;                             its poll/scan loop far more than any driver needs,
;;                             so 1 (half) or 2 (quarter) reclaims host CPU. Default
;;                             0 (off/legacy). Verify music/SFX timing by ear before
;;                             keeping — stage 2 has been found to break audio
;;                             timing.)
;;   arm7_batch      = 1 | 2 | 4 | 8 | 16  (ARM7 slice batching. The sound CPU runs
;;                             once every N AICA updates with the cycles of all
;;                             N. Same ARM clock and same audio sample stepping;
;;                             only the SH4<->ARM interleave gets coarser. Fewer
;;                             switches between the two CPUs' code and data.
;;                             1 = every update; 4 is the DEFAULT since
;;                             2026-09-17 (Castlevania +1.5% speed with the
;;                             sound CPU at 6.2% instead of 7.4%, Sega Tetris
;;                             agreed). This changes emulated timing, unlike
;;                             arm7_jit: 8 and 16 make Castlevania's music
;;                             wobble loud/quiet (same symptom as
;;                             arm7_speed=1). Set arm7_batch=1 for any game
;;                             whose music or SFX sound wrong.)
;;   arm7_jit        = 0 .. 5  (ARM7 sound-CPU recompiler; off/on = 0/1.
;;                             0: the cached interpreter. 1: ARM code is
;;                             translated to PPC with the same results and
;;                             timing. 2 (default): same, plus blocks branch
;;                             straight to each other instead of going back
;;                             through the dispatcher after every branch.
;;                             1..5 all Wii-measured; 5 is the default. 3: same as 2, plus
;;                             the dispatcher runs in emitted code and every
;;                             return (MOV pc,lr / LDMFD ..pc) remembers where
;;                             it went last time (Wii-measured: about 1.5% less
;;                             ARM cost than 2). 4: same as 3, plus push/pop
;;                             (LDM/STM) run inline (Wii-measured: ARM cost -7%
;;                             vs 2). 5: same as 4, with a cheaper time-slice
;;                             test on every instruction and EQ/NE/MI/PL
;;                             conditions reusing the previous instruction's
;;                             result; awaiting Wii A/B vs 4.
;;                             With jit_ccalls=on, [ARMJIT] lines in the log
;;                             count exits, cache hits and C helper calls.
;;                             The arm7di conformance tests run once at ARM init
;;                             (see [ARM7JIT] in /ndclog.txt); a failure falls
;;                             back to the interpreter. Compare arm:% on the
;;                             stats line and listen before keeping.)
;;   fastmem         = on | off  (PPC-MMU fastmem for the SH4 dynarec. Maps the DC
;;                             address space via segment regs + a hashed page
;;                             table so JIT loads/stores are branchless; MMIO/SQ/
;;                             BIOS accesses DSI-fault once and get back-patched to
;;                             slow-path trampolines. Default on. Experimental —
;;                             A/B per game if it misbehaves.)
;;   bcache          = on | off  (flat dynamic-branch dispatch cache for the SH4
;;                             dynarec. Dynamic jumps (jmp/rts/bsrf) hit one 8-byte
;;                             {addr, code} entry instead of chasing cache[] ->
;;                             DynarecBlock across two cache lines + a counter
;;                             write. Default off (legacy). Perf preset — A/B.)
;;   fpu_pin         = on | off  (pins SH4 fr0-15 to real PPC FPU registers for the
;;                             whole session, the same scheme int GPRs already use.
;;                             Speeds up geometry-heavy games (fadd/fmul/fmac/
;;                             fipr/ftrv/cvt_* stop round-tripping through memory).
;;                             Default off — new and unproven, A/B per game,
;;                             especially anything 3D-transform heavy.)
;;   jit_align       = on | off  (pads each SH4-dynarec block entry to a 32-byte
;;                             Broadway L1 cache line, so every branch/link target
;;                             begins on a clean line boundary. Cache-hygiene only,
;;                             no logic change, marginal effect. Default off.)
;;   ifb_flush       = on | off  (narrows the register spill around interpreter
;;                             fallbacks. Opcodes the dynarec hands to the
;;                             interpreter were always wrapped in a FULL
;;                             register-file spill - 15 stores + 15 loads, plus
;;                             32 more FP ops with fpu_pin on - even though the
;;                             handler touches about two registers. 28 opcodes
;;                             take that path, including div1, addc, subc, addv,
;;                             subv, negc, rotcl, rotcr, cmp/str, xtrct, swap.b,
;;                             mac.l, mac.w and tas.b. div1 is the costly one:
;;                             the SH4 has no divide instruction, so one 32-bit
;;                             software division is ~32 div1 and pays the spill
;;                             every time. The GPR set and the float file are
;;                             decided independently, since they do not
;;                             correlate: "lds Rn,FPSCR" needs only Rn but must
;;                             spill fr[], "ldc Rn,SR" needs every GPR but no
;;                             float, fcnvds/fcnvsd need float only. Closed
;;                             allow-list - anything not listed (trapa, sleep,
;;                             illegal, double-precision FPU) keeps the full
;;                             everything-spill, so an unlisted opcode is slow,
;;                             never wrong. Default off.
;;                             Perf preset - A/B per game, best candidates are
;;                             games doing lots of integer division.)
;;   ifb_probe       = on | off  (diagnostic. Counts interpreter fallbacks per
;;                             opcode and writes an [IFB] breakdown to
;;                             /ndclog.txt once a second: total per second, how
;;                             much of it ifb_flush could narrow, and the spill
;;                             memory-op rate with and without it. Use it to see
;;                             whether ifb_flush is worth testing on a game
;;                             before doing the A/B. Costs 4 instructions per
;;                             fallback site, so turn it off for timing runs.
;;                             Both keys are read when code is COMPILED, so set
;;                             them before launching, not mid-game. Default off.)
;;   jit_newops      = on | off  (dynarec nine opcodes that had always fallen
;;                             back to the interpreter: stc SR, stc.l SR,
;;                             ldc.l SR, ldc SR, lds FPSCR, lds.l FPSCR, rotcl,
;;                             rotcr and tas.b. In every case the code to compile
;;                             them already existed and simply was not reachable
;;                             from the opcode table, so each execution paid a
;;                             full interpreter call-out plus its register spill.
;;                             stc SR is the one that measured: it is the top
;;                             fallback in several ChuChu Rocket scenes at up to
;;                             96k/s. With this on, all nine stop reaching
;;                             ifb_flush's allow-list entirely. Changes SH4 core
;;                             codegen, so default off. Perf preset - A/B per
;;                             game, and run ifb_probe first to see if a game
;;                             issues enough of these.)
;;   jit_hotblocks   = on | off  (diagnostic. Counts executions per compiled SH4
;;                             block and writes the hottest ones to /ndclog.txt
;;                             once a second as [HOT] lines, each with its
;;                             codegen density - PPC bytes emitted per SH4
;;                             opcode - plus a full SH4 + PPC dump of the top
;;                             block twice per session. This is how you find
;;                             where the dynarec really spends the frame and
;;                             whether the code it emitted there is any good;
;;                             ifb_probe covers the interpreter-fallback path,
;;                             this covers everything else. Costs 4 instructions
;;                             at every block entry, so turn it off for timing
;;                             runs. Read when code is COMPILED, so set it
;;                             before launching. Default off.)
;;   jit_tfwd        = on | off  (forwards the SH4 T bit from the register it
;;                             was just computed in straight to the branch that
;;                             consumes it. sr_T is not pinned, so a compare
;;                             followed by bt/bf - the commonest shape there is
;;                             on SH4 - was emitting "stw T" then "lwz T" back
;;                             to back: same address, same register, a
;;                             load-hit-store stall on Broadway to recover a
;;                             value that never left the register. Found with
;;                             jit_hotblocks on the #1 block of a ChuChu scene.
;;                             The store stays, since a later block may read T;
;;                             only the reload goes, and only when the compare
;;                             is the immediately preceding op. Changes SH4
;;                             codegen, so default off. Perf preset - A/B per
;;                             game.)
;;   jit_carry       = on | off  (dynarecs the SH4 carry/overflow arithmetic
;;                             that always called the interpreter: addc, subc,
;;                             negc, addv, subv, div1, plus cmp/str, xtrct,
;;                             swap.b and clrmac. SHIL had no opcode that could
;;                             produce a value AND the new T bit, so all ten
;;                             went through the fallback; they now have real
;;                             shil ops with PPC codegen that maps T onto
;;                             XER[CA]/XER[OV]. Expect TENTHS of a percent, not
;;                             a breakthrough - with ifb_flush on, a fallback is
;;                             ~35-45 cycles and Castlevania runs ~49.5k/s of
;;                             them = ~0.3% of the frame. Run ifb_probe first to
;;                             see if a game issues enough to be worth an A/B.
;;                             Also a CORRECTNESS fix: the interpreter's div1
;;                             skipped the q^M^carry step, so T was wrong
;;                             whenever the bit shifted out of Rn was set or M
;;                             was 1 (signed division) - mostly invisible
;;                             because the 32-step rotcl/div1 idiom is matched
;;                             and replaced with a real divide. Read when code
;;                             is COMPILED, so set it before launching.
;;                             Default off. Perf preset - A/B per game.)
;;   jit_mac         = on | off  (dynarecs mac.l and mac.w, the last two opcodes
;;                             with no dynarec path at all. Their two @Rm+/@Rn+
;;                             reads become ordinary readm ops, so they go
;;                             through FASTMEM instead of the interpreter's
;;                             ReadMem; what is left is mullw/mulhw + addc/adde
;;                             inline. Kept separate from jit_carry because
;;                             these are the only ops in that batch that touch
;;                             memory, so they can be bisected on their own.
;;                             Also makes saturation mode (SR.S=1) work - it
;;                             used to be fatal for mac.l and a silently
;;                             skipped instruction for mac.w. Expect nothing
;;                             for most games: the SH4 has a real FPU, so MAC
;;                             is far rarer on it than on the SH2 this came
;;                             from - run ifb_probe first. Read when code is
;;                             COMPILED, so set it before launching.
;;                             Default off. Perf preset - A/B per game.)
;;   jit_fipr        = on | off  (the dynarec's FIPR/FTRV add their four products
;;                             in double and round to single ONCE, as the SH4
;;                             does, instead of rounding after every fmadds.
;;                             Checked offline against skmp's bit-exact model of
;;                             the real chip: mixed-sign dot products go from
;;                             59% to 86% bit-exact (same-sign 75% -> 93%) and
;;                             the up-to-99+ ulp misses where terms cancel are
;;                             cut short. Try it on vertex jitter, z-fighting or
;;                             physics/replay drift. Same instruction count, but
;;                             double fmadd may cost a little on Broadway.
;;                             Read when code is COMPILED, so set it before
;;                             launching. Default off. A/B per game.)
;;   div32_fix       = on | off  (the dynarec replaces the SH4's 64-instruction
;;                             division loop with one real divide. on (default):
;;                             a 64/32 divide in one's complement, the same
;;                             result as the real loop (checked on the PC over
;;                             millions of cases). off (legacy): a 32/32 divide
;;                             that dropped the high word: wrong results for
;;                             every unsigned 64/32 divide and about 1 in 3
;;                             signed ones. The BIOS, Sonic Adventure and
;;                             Rayman 2 use it. Read when code is COMPILED.)
;;   interp_fix      = on | off  (six SH4 instructions in the slow interpreter
;;                             path (div1, addv, subv, mul.l, mac.w, mac.l) give
;;                             the real CPU's result. on (default). off (legacy):
;;                             div1 was wrong 3 times in 4, and mac.l in
;;                             saturation mode froze the emulator. Matters in
;;                             interpreter mode and when the dynarec falls back
;;                             to the interpreter.)
;;   gdrom_stat_fix  = on | off  (where the emulated drive says it is on the
;;                             disc. on (default): the real position, track
;;                             number and track type. off (legacy): the position
;;                             came out wrong on the Wii (45150 read as 176) and
;;                             one of the two reports had every byte shifted.
;;                             Used by the BIOS CD player and by games that time
;;                             their CD music.)
;;   gdrom_hang_fix  = on | off  (unusual drive commands. on (default): answered
;;                             like a real drive (rejected, shortened or
;;                             ignored). off (legacy): about ten of them froze
;;                             the emulator (unknown commands, odd lengths, a
;;                             DMA longer than its read...). Also fixes the
;;                             2340-byte sector read some CD images ask for.)
;;   toc_fix         = on | off  (the disc's table of contents, as the BIOS and
;;                             games read it at boot. on (default): every track
;;                             entry and the end-of-disc entry are filled in the
;;                             way a real drive reports them, and a GDI's first
;;                             area ends where its track 2 really ends. off
;;                             (legacy): some of those fields were 0 or a fixed
;;                             guess.)
;;   spg_fix         = on | off  (video timing signals a game can read or wait
;;                             on. on (default): the interlace field flag changes
;;                             once per frame (it changed on every line), and
;;                             the horizontal-blank interrupt comes when the
;;                             game asked for it (it came once per frame
;;                             whatever the game set). off: legacy.)
;;   ta_guard        = on | off  (damaged graphics data. on (default): a record
;;                             the graphics chip cannot use is skipped. off
;;                             (legacy): the emulator froze, or could crash, on
;;                             it. No game is known to send such data; this only
;;                             protects against stale or corrupted data.)
;;   gdrom_spinup    = on | off  (booting the BIOS with no disc. on (default):
;;                             the drive reports "busy" for 3 seconds while it
;;                             "spins up", like a real one, so the BIOS plays
;;                             its swirl intro. off (legacy): "no disc" at once,
;;                             and the BIOS skipped the intro.)
;;   idle_kamui      = on | off  (a speed rule. Many games built on Sega's Kamui
;;                             library (CvS2, Rez, Ikaruga, Quake III, Rayman 2,
;;                             Power Stone 2...) wait for the next frame in a
;;                             small loop. on (default): that loop is recognised
;;                             by its exact code and stops wasting host time,
;;                             without changing the game's own timing. off:
;;                             legacy. Set before launching.)
;;   idle_shinobi    = on | off  (a speed rule. Games built on Sega's Shinobi
;;                             library (Garou, Border Down, Sonic Shuffle...)
;;                             have an idle loop that checks a list of 16 jobs
;;                             forever. on (default): that loop is recognised
;;                             by its exact code and skips ahead up to 15 time
;;                             slices, stopping at once when an interrupt makes
;;                             a job ready, without changing the game's own
;;                             timing. off: legacy. Set before launching.)
;;   idle_x3         = on | off  (a speed trade, PER GAME. The emulator guesses
;;                             which small loops are a game waiting, and makes
;;                             them pass time 30x faster. That guess also hits
;;                             some real work, so a game can lose frames while
;;                             SPEED still reads 100%. on: a gentler x3 guess,
;;                             only for loops that jump back. It costs about
;;                             1.5x more Wii time, so it only helps a game that
;;                             runs below its frame rate with SPEED to spare.
;;                             Judge it by fps x 100 / SPEED%, not SPEED alone.
;;                             On the PS3 it helped Jet Grind Radio, Donald
;;                             Duck, PSO and Sonic Adventure, and hurt Quake
;;                             III, Tomb Raider, Looney Tunes and Ecco. Those
;;                             sections carry a commented "; idle_x3=on" line:
;;                             try it there first. off (default): the x30 rule.
;;                             Set before launching.)
;;   flash_chip      = on | off  (the Dreamcast's settings memory (flash). on
;;                             (default): it behaves like the real chip, as in
;;                             Flycast -- the BIOS's write and erase commands
;;                             work, and the factory area is protected. off
;;                             (legacy): every write was stored as-is, so the
;;                             command bytes ended up mixed into the data. It
;;                             mattered little while the flash was never saved.)
;;   flash_save      = on | off  (keep the Dreamcast's settings between
;;                             sessions. on (default): when you quit, if the
;;                             BIOS settings (language, sound...) or a game's
;;                             flash data changed, they are saved to
;;                             data/dc_flash_wb.bin, which is loaded instead of
;;                             dc_flash.bin next time. Needs flash_chip=on.
;;                             dc_flash.bin itself is never changed: delete
;;                             dc_flash_wb.bin to go back to it. off (legacy):
;;                             every change was lost at the next boot.)
;;   rtc_host        = on | off  (the Dreamcast's date and time. on (default):
;;                             taken from the Wii's clock at every boot. off
;;                             (legacy): it carried on from where it was at the
;;                             last exit, so it fell behind real time.)
;;   inf_vtx         = on | off  (3D points a game places "at infinity". on
;;                             (default): they are left out and the shape around
;;                             them is still drawn. off (legacy): they were drawn
;;                             as garbage -- Soul Calibur's spikes and stray
;;                             triangles.)
;;   sched          = on | off  (unified cycle-deadline event scheduler. Fires
;;                             GD-ROM read-done, ch2/PVR/AICA-DMA completion,
;;                             render-done and TA list-end through one deadline
;;                             queue in true hardware order, instead of at their
;;                             own tier of the Medium/Slow/VerySlow timeslice
;;                             cascade. Default off. EXPERIMENTAL — A/B per game.)
;;
;; DEBUG LOGS (all default off, options page 6, output goes to /ndclog.txt on
;; the card — leaving one on costs card writes every frame, so turn it back off
;; once it has answered its question):
;;   debug_log_framebuffer2d = on | off  (answers "is framebuffer_2d worth
;;                             trying on this game?". Logs every bit-24 render
;;                             pass the framebuffer_2d preset would act on —
;;                             the ones that get dropped while it is off:
;;                               [PATH] 2D-blit : Try Enabling FRAMEBUFFER_2D PRESET
;;                               [PATH] 2D-after-3D : Try Enabling FRAMEBUFFER_2D PRESET
;;                             With framebuffer_2d=on the same lines confirm the
;;                             preset is doing the work instead. NO such line in
;;                             the log means the game never takes that path and
;;                             framebuffer_2d cannot help it. Self-quieting: the
;;                             first 8 of each kind, then one line per 600.)
;;   debug_message   = on | off  (renderer trace — the [PATH], [FB], [RTT]... lines)
;;   debug_loop      = on | off  (per-loop CPU/GD-ROM/IO trace. VERY slow.)
;;   debug_gdrom     = on | off  (GD-ROM / CDDA SPI command trace)
;;   debug_skip_tex  = 0 | <VRAM address>  (HIDES every polygon that uses one
;;                             texture. Diagnostic only: it REMOVES geometry, it
;;                             never fixes anything. Takes an address straight
;;                             off a [SCN] census line's addr= field, hex or
;;                             decimal, e.g. debug_skip_tex=0x52C000; 0 = off.
;;                             The options-page-6 row toggles it on/off in place,
;;                             so one build can A/B a scene as many times as you
;;                             like. Answers the question a census cannot: is an
;;                             element missing or washed out because something is
;;                             painted OVER it (hide the suspect and it appears
;;                             correctly), or because the element itself is drawn
;;                             wrong (hide everything around it and it is still
;;                             wrong)? This is how the Hokuto no Ken layering bug
;;                             was finally pinned down.)
;;   tex_wrap_guard  = on | off  (persistent texture arena exhaustion. CACHE_FAST/
;;                             CACHE_NORMAL/CACHE_VERY_FAST_PLUS all reuse a 14 MB
;;                             arena handed out append-only across frames, so old
;;                             cache-hit textures are live while the GPU samples them.
;;                             Mid-frame: if the arena fills, on calls GX_DrawDone()
;;                             to drain the GPU queue so all handed-out bytes are dead,
;;                             then wraps the arena safely. Second exhaustion in the
;;                             same frame falls back to the skimp slot. off (default):
;;                             legacy wrap without the drain — if the GPU is still
;;                             sampling old textures, their bytes are overwritten and
;;                             the samples read garbage (arena-wrap race corruption).
;;                             Mechanism Wii-CONFIRMED with v2's GP drain; the JSR
;;                             intro still streaked with v2 on, ruling this out as
;;                             the cause of that symptom. Watch [TEXC] drains=/wraps=
;;                             to verify the fix is firing. UNVERIFIED on real
;;                             hardware other than the mechanism — test per-game.)
;;   tex_clamp_fix   = on | off  (per-polygon texture clamp/flip caching. The PVR's
;;                             ClampU/V + FlipU/V wrap modes are per-POLYGON TSP bits,
;;                             not texture attributes. This renderer bakes them into
;;                             GXTexObj only on DECODE; cache HITS ignore those bits
;;                             and reuse the FIRST polygon's wrap mode. A tiled floor
;;                             inheriting GX_CLAMP smears its edge texels to infinity —
;;                             the "streaked" / "infinite X or Y coordinate" symptom.
;;                             on: every texture bind re-applies the binding polygon's
;;                             wrap mode via GX_InitTexObjWrapMode before GX_LoadTexObj,
;;                             at negligible cost (two bitfield writes per cache hit).
;;                             off (default, legacy): the old behaviour — reused
;;                             textures keep the first polygon's wrap mode forever.
;;                             Wii-CONFIRMED: fixes streaked textures in Crazy Taxi
;;                             (very_fast+ trees), Deadly Skies (fast/very_fast+ floors),
;;                             Jet Set Radio (very_fast+ intro). Does NOT fix Shadow
;;                             Man's sky, which uses cache:quality (re-decodes every
;;                             frame, never susceptible to stale wrap mode).)
;;   tlut_fix        = on | off  (CI4/CI8 palettes - 4bpp=ci4_fast/ci4_normal and
;;                             8bpp=ci8_fast/ci8_normal. The GPU reads a palette from
;;                             memory only when it reaches the load command in its
;;                             FIFO, long after the CPU queued it. off (legacy): each
;;                             palette is staged in one of 16 rotating buffers, which
;;                             is only safe while the CPU stays less than 16 palette
;;                             changes ahead of the GPU. A game that stops being
;;                             CPU-bound breaks that, and draws pick up another
;;                             draw's colours: SF3 3rd Strike under
;;                             tex_cache=normal_plus flickered wrong colours on the
;;                             characters at full speed (4bpp=i4_stub/4bpp_optimized
;;                             hid it only because they use no palette load).
;;                             on (default): palettes come from a per-render copy of
;;                             the whole palette RAM (2 KB) that never changes while
;;                             the GPU can still read it, and a palette already
;;                             loaded in the same render is not loaded again.
;;                             Menu row: PAGE 6 (EXPERIMENTAL), TLUT FIX.)
;;   strip_dedup     = 0 | 1 | 2  (NUMBER, not on/off. Menu row lives on PAGE 8
;;                             (LOGS), because mode 1 -- the census -- is the only
;;                             mode worth using; mode 2 measured ~0.5% and is kept
;;                             only so the ceiling stays reproducible.
;;                             Skips the texture bind a strip repeats from the
;;                             strip immediately before it.
;;                             A game that draws many copies of ONE model submits
;;                             one polygon parameter header per copy and every one
;;                             carries the same TSP/TCW — the renderer never learns
;;                             they are the same object, it only ever sees vertices
;;                             the game already transformed, but it can see that the
;;                             header is bit-identical to the last one it acted on.
;;                             Everything the bind computes (cache slot routing,
;;                             format/size decode, palette upload, wrap mode,
;;                             GX_LoadTexObj) derives from that header alone, so a
;;                             repeat has nothing left to do.
;;                             0 (default): off, every textured strip re-binds.
;;                             1 = CENSUS ONLY. Applies state exactly as legacy and
;;                             skips NOTHING; once a second it writes to ndclog.txt
;;                             how many parameter headers repeated the one before
;;                             them, how much GEOMETRY rode on those repeats, and
;;                             the top textures by vertex share:
;;                               [STRIP_DEDUP] mode:1 frames:.. hdr/f:.. tex/f:..
;;                                   run-dup:NN%  geom-dup:NN%  distinct:N
;;                               [STRIP_DEDUP]   tex=ADDR fmt=N ... strips/f:..
;;                             run-dup IS the hit rate mode 2 would get — it is
;;                             measured against the same key, not modelled. Low
;;                             run-dup means this scene has nothing to win here and
;;                             mode 2 should stay off; the per-texture lines say
;;                             whether one model really does dominate the frame.
;;                             2 = SKIP. A textured strip whose TSP+TCW equal the
;;                             last bind's returns immediately.
;;                             Mode 2 is a behaviour change, hence opt-in: it assumes
;;                             the VRAM texels behind a repeated TCW did not change
;;                             between the two strips. Inside one render that is what
;;                             every tex_cache preset already assumes, but a game that
;;                             rewrites a texture between two strips sharing a TCW
;;                             would keep the stale one — if a texture starts flashing
;;                             or freezing on one frame, that is this.
;;                             Ceiling check before spending time on it: the render
;;                             loop as a whole was Wii-measured at ~7% of the frame,
;;                             so this can only ever be worth a few percent. It does
;;                             not touch the ~63% spent running the game's own
;;                             transform code, which is where mouse mania's cost is.
;;                             Mode 1 ALSO dumps a [RENDER_PATH] line: one
;;                             counter per exit path of StartRender(), because
;;                             StripCount says N strips were submitted while the
;;                             strip census says DoRender only ever walked N/4 of
;;                             them. Every path other than RENDER: threw away
;;                             geometry the TA had already paid to decode.
;;                             Figures are per DoRender call, so StartRender/f
;;                             reads 1.00 when nothing is being dropped:
;;                               [RENDER_PATH] StartRender/f:3.90 vtx0/f:.. strips/f:..
;;                                   | bit24_DROPPED:2.90  RENDER:1.00
;;                             The path counters themselves are never gated (one
;;                             increment per render request, ~35/s), only their
;;                             printing is, so they are always true.)
;;
;; EXAMPLE FILENAMES THAT WOULD MATCH:
;;   [jojo]        matches  JoJos_Bizarre_Adventure.gdi  or  jojo_dc.cdi
;;   [daytonausa]  matches  DaytonaUSA.gdi  or  daytona_usa_2001.cdi
;;
;; [default] IS SPECIAL:
;;   Not matched against any filename — its fields are applied first, on
;;   every launch, before the per-game section below is matched. Per-game
;;   sections only need to list the fields that differ from [default].
;;   It is pre-filled here with the emulator's built-in (out-of-the-box)
;;   defaults, so editing it changes the baseline for every game at once.
;; --------------------------------------------------------------------------


[default]

;; Exit combo shutdown: 0=off (legacy bare exit(0)), 1=safe teardown,
;; 2=safe + loader-stub watchdog, 3=also poll the combo host-side once a
;; frame so a game that stopped polling Maple can still be exited.
;; Turn this to 1 if going back to the Homebrew Channel sometimes leaves
;; a black screen with the Wii on; to 3 if a hung game traps you as well.
exit_fix=3

;; General
ratio=fullscreen
speed_limiter=on
show_fps=on ; gameplay FPS/speed overlay
graphics=normal
gx=on
lod_bias=0.0
aniso=0x
tex_cache=normal
4bpp=ci4_fast
8bpp=ci8_fast
tlut_fix=on ; CI4/CI8 palettes from a per-render copy, not a 16-slot ring (SF3 colour flicker)
frameskip=0
framebuffer_2d=off
adv_alpha=on
blend_mode=on
fps_boost=off
punch_through=off
trans_sort=off
render_to_texture=off
split_screen=off
layout=off ; special controller layout slot (off/chuchu/ddr_select/user_cfg).
           ; Resets it per game selection -- without this line a layout set
           ; by one game, or picked by hand on the CONTROLS menu, stayed
           ; active for every game launched afterwards in the same session.

;; Graphics
fmv_format=tev ; changed from rgb565, TEV seems the fastest now
yuv_twiddle_fix=on ; this preset is likely to disapears
yuv_stride=texctl
vertex_color=on
decal_alpha=off
seam_fix=off ; it has to be a default off, can break some textures
fog=off
fog_index=on ; with fog on: table indexed by density/W (PVR 1/W depth), not W*density
bg_poly=off
rgb565_opaque_alpha=off
jojo_fix=off
offset_color=on

;; Depth & Width
legacy_depth=off
depth_clip=1
fixed_depth=0
hud_pass=0
subpass_zclear=off
ppz_write=on
isp_depth_func=0
isp_cull=0

autosort=0
layer_sort=off
list_order=off ; opaque list drawn first when a game submits it after the TR list
layer_back_tex=0 ; address of a backdrop texture to sort behind the sprites (0 = off)
layer_front_tex=0 ; address of an overlay texture to draw on top of the sprites (0 = off)
x_scaler=on
y_scaler=off
h_scaler=off
canvas_width=0

poly_offset=0

;; Audio
audio_buffers=4 ; normal
audio_drc=2 ; normal (-/+ 3% )
cdda=on
cdda_pause_fix=on ; on = pausing CD music keeps its place (real DC); off jumps back to the disc start
cdda_state_fix=on ; Flycast CD-DA states: seek pauses, resume only a pause, data read stops audio, end >= + "ended"
mute_pcm16=off
arm7_str_align=on ; on = unaligned ARM7 word stores write the aligned word (real ARM7DI); ChuChu SFX fix
aica_fast=on  ; same sound, less CPU in the sound mixer. Wii-CONFIRMED: aica% 10.0->7.7, speed +2.6%
adpcm_loop=on ; on = looped ADPCM effects keep their volume on every lap (SA2 held SFX)
arm7_speed=0 ; 10 Mhz. 5 Mhz can work
arm7_jit=5   ; 5 = best speed. 0 = accuracy. ARM7 sound-CPU recompiler: 0 = interpreter, 1 = basic, 2 = + block linking, 3 = + return cache, 4 = + inline push/pop, 5 = + lean per-instruction code (all Wii-measured, same timing)
arm7_batch=4 ; can try 8 or 16 . Run the sound CPU once every N AICA updates (1/2/4/8/16; 4 Wii-measured +1.5%, 8+ wobbles)
arm7_reset_fix=on ; ARM7 reset enters SVC mode + clears the FIQ latch, as the real ARM7DI / Flycast
aica_race=on  ; Flycast AICA timing: G2 DMA end/ADEN/busy rules, SCIEB/MCIEB at once, ARM +50 cycles after an SH4 IRQ
aica_ca_clamp=off ; GAME WORKAROUND only (Visual Concepts sports games): CA read clamped 3 below the loop end

;; Core
accuracy_int=fast ; testing FAST as default in alpha0.52
accuracy_fpu=fast
async_render=on
render_delay=flycast ; render-done after 450000 + 100 x TA bytes (max 1.5M) cycles, instant list IRQs (Flycast; other_fix.md 2.4). off = legacy
tmem_cache=on
sh4_clock=200 ; SH4 core clock in MHz (150..200); 200=full speed, lower=faster host/slower game
cdi_hdr_fix=on ; on = V2/V3 .cdi images find their header (cdirip rule); off = legacy, those images fail to load
flash_broadcast=disc ; off = flash decides 50/60 Hz; disc = 60 Hz for JP/US discs, 50 Hz for EU-only; ntsc = always 60 Hz
interp_fix=on ; SH4 interpreter div1/addv/subv/mul.l/mac.w/mac.l as the manual (div1 was wrong 3 steps in 4)
gdrom_stat_fix=off ; drive position reports (REQ_STAT/GET_SCD): real FAD, track and type from the TOC
gdrom_hang_fix=on ; rare drive commands answered like a real drive instead of freezing (die/verify)
toc_fix=on ; TOC: ADR 1 per track, data lead-out entry, GDI track-2 end from file size, GDI session table
spg_fix=on ; video timing: field bit once per frame, HBlank IRQ per SPG_HBLANK_INT mode, VBLANK_INT reset value
ta_guard=on ; skip bad TA records (list-set, types 3/6, invalid polygon type) instead of die()/wild call
gdrom_spinup=on ; no disc: drive BUSY 3 s after reset, then NODISC, so the BIOS plays its swirl intro
rtc_host=off ; Dreamcast clock set from the Wii clock at every boot (not the value saved at last exit)
idle_kamui=on ; Kamui vsync wait loop ends its timeslice after 1 turn (PS3: Ikaruga 77->87%); exact-code match
idle_shinobi=on ; Shinobi idle task walk: 15-slice debt dropped by the next interrupt (PS3: Garou 80-86->100%); exact-code match
idle_x3=off ; PER GAME: idle-loop rule x3 (bf / backward bt) instead of x30; ~x1.5 SH4 host time. Resets a per-game ON
flash_chip=on ; flash obeys AMD program/erase commands (Flycast DCFlashChip); factory partition protected
flash_save=on ; write the flash back to data/dc_flash_wb.bin at exit if the session changed it (needs flash_chip)
inf_vtx=on ; cut 1/W=+inf TA vertices out of their strips (Soul Calibur spikes); finite runs drawn as own strips
jit_sbp=1     ; JIT Stale Block Protection stage (0=off, 1=known self-modifying addrs, 2=every RAM block)
jit_ici=0     ; guest CCR.ICI handling (0=clear whole JIT cache, 1=ignore, 2=ignore+force jit_sbp=2)
jit_link_guard=on ; on = never link a static exit that a cache clear overwrote; off logs [LINK] only
fastmem=on    ; PPC-MMU fastmem for the SH4 dynarec
bcache=on    ; flat dynamic-branch dispatch cache for the SH4 dynarec
dyn_ic=2     ; inline cache on dynamic branch exits, incl. RTS; Wii-measured +0.98%
fpu_pin=on   ; pin SH4 fr0-15 to real PPC FPU registers (experimental)
jit_align=on ; 32-byte block-entry alignment (cache hygiene, marginal)
ifb_flush=on ; Interpreter fallback : do some dynarec stuff (+1%)
ifb_probe=off; Debug messages, not usefull
jit_newops=on  ; nine opcodes that always fell back to the interpreter (stc/lc SR, lds FPSCR, rotcl/rotcr, tas.b)
jit_hotblocks=off ; Debug messages, not usefull
jit_tfwd=on  ; forward the SH4 T bit from the compare to the branch
jit_fmov=on  ; fmov reads/writes straight to/from the pinned FPRs on the fastmem path
             ; instead of bouncing through a GPR and memory; needs fpu_pin+fastmem,
             ; Wii-measured +10% on Castlevania (103% -> 113%)
jit_carry=on ; dynarec addc/subc/negc/addv/subv/div1/cmp-str/xtrct/swap.b/clrmac
             ; instead of calling the interpreter for them. Also fixes div1,
             ; whose interpreter version had the wrong Q/T. Tested on wii. No changes on castlevania. Maybe some changes on Sega Tetris
jit_mac=on   ; dynarec mac.l/mac.w (reads via fastmem) + real saturation support.
             ; TESTED on Wii = no change. check ifb_probe for mac.l/mac.w.
jit_fschg=on ; fschg toggles FPSCR.SZ only, so UpdateFPSCR() has nothing to do but
             ; keep old_fpscr in step -- one stw instead of 16 stfs + a C call +
             ; 16 lfs. DC T&L brackets its vertex loop with fschg, so it fires
             ; ~2.3x per transformed vertex. Wii-CONFIRMED +10% in ChuChu mouse
             ; mania at matched load; null in Castlevania (does not run it hot).
jit_cr0=on   ; a conditional block exit branches on the PPC CR0 bit the compare
             ; already set, instead of mfcr/rlwinm/stw/cmpi to rebuild it. sr_T
             ; is still written, as the constant each path implies, so nothing
             ; assumes T is dead. Only fires when the flag producer is the
             ; block's LAST op. Wii-measured +2.8% on the BIOS boot phase, null
             ; in Castlevania gameplay, NOT yet measured in ChuChu.
ta_profile=off ; DEBUG. Measures the TA (tile accelerator) decoder's share of wall
             ; time and prints it as ta: on the stats line. OFF by default because
             ; the bracket is per 32-byte TA block -- about once per Dreamcast
             ; vertex, ~500 K/s -- and costs roughly 1% of the machine:
             ; libPvr_TaSQ is 9 PowerPC instructions with it off, 24 with it on.
             ; With it off ta: prints --.-; vt: and v/st are free and still work.
             ; Turn it on only while working on the tile accelerator.
jit_ccalls=off ; DEBUG. Counts every C function the dynarec still calls out to and
             ; prints a [CC] block once a second with per-second AND per-frame
             ; rates (scheduler tick, interrupt, bm_GetCode, do_sqw/TA, UpdateSR,
             ; UpdateFPSCR, fsqrt, fsrra, ReadMem/WriteMem misses, mac sat).
             ; Counters live inside the callees so it is far cheaper than
             ; jit_hotblocks (12.6%), but still re-measure speed with it off.
             ; With the ARM7 JIT on it also prints [ARMJIT] lines (sound CPU).
blockcopy=on  ; store-queue and DMA block transfers copy in bulk instead of
             ; running the memory dispatcher once per 32-bit word. do_sqw()
             ; Wii-CONFIRMED +2%.
             ; pushed every non-TA store-queue flush through 8 dispatcher
             ; calls, and PVR/ch2 DMA one per word of the whole transfer.
             ; Crazy Taxi measured 1,104,636 system-RAM writes/s, 95.6% of
             ; them from plain C code rather than JIT code. MMIO, mirror
             ; wraps and region crossings still take the per-word path.
jit_fsqrt=on  ; inline fsqrt as frsqrte + Newton-Raphson instead of calling
             ; newlib sqrtf, which is a 25-iteration shift-and-subtract bit
             ; loop bracketed by two load-hit-store stack round-trips (~300
             ; cycles). Crazy Taxi measured 167,906 fsqrt/s. frsqrte alone is
             ; only a 5-bit estimate -- it distorted the BIOS swirl once -- so
             ; it seeds 3 Newton steps plus an exact-residual step, verified
             ; bit-identical to sqrtf over 2.07 M simulated cases. Zero,
             ; negative, Inf and NaN still take the old libm call.
             ; ALSO inlines FSRRA (1/sqrt), added 2026-09-18: that is the same
             ; frsqrte+Newton sequence stopping one step earlier, and it sits in
             ; ChuChu Rocket's per-vertex T&L block (8C107502, inside the
             ; ~250 MB/s run at 8C1074EE) where it ran ~600k times a second as a
             ; libm call. Wii-CONFIRMED ~+35%: mania went 72% -> 97% at matched
             ; vt/frame, and fsrra vanished from the [CC] census entirely. The
             ; win is rate x body: 600k/s x newlib sqrtf's ~300-cycle bit loop
             ; = 26% of the frame. Both emitters print their own [fsqrt] line --
             ; fsrra stayed a call-out unnoticed precisely because only fsqrt's
             ; line existed. Same one-compare guard, same cold libm fall-back.
jit_fipr=on  ; fipr/ftrv: sum in double, round to single once like the SH4
             ; (instead of after every fmadds). Accuracy preset, awaiting Wii A/B.
div32_fix=on ; matched rotcl/div1 divide done as 64/32 one's complement (was 32/32: wrong quotients)
             

;; Experimental Stuff & Debug
mipmap=off
dma_fix=on    ; ch2/PVR/Sort/AICA-G2 DMA correctness fixes (NullDC PSP port parity)
mmucr_fix=1   ; MMU control register at its real bits (0=legacy, 1=bits, 2=full PS3-tested set; Rez/Ikaruga boot)
