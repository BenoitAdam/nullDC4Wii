tex_cache=normal ; very_fast+ and vq_cmbr works with minor bug. Maybe retest fast also ?
ppz_write=on ; needed for draw distance 
mipmap=off ; trilinear halves texture fill rate (-40% FPS) in this game


[theflinstones][the flinstones]
tex_cache=normal




[tokyo highway challenge 2]
tex_cache=normal ; only normal tested for now
legacy_depth=off ; On seems to work also
offset_color=off ; specular off (else : white AE86)
fixed_depth=on ; fix a bit of z-fighting
hud_pass=2 ; probably needed, please test 1 also
decal_alpha=on ; else car is black & buggy
isp_cull=2 ; needed or big polygons blocking the view
punch_through=on ; needed or car lights on ground will be wrong, showing scenery

