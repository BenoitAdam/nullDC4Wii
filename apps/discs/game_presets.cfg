;; ---------------------------------------------------------------------------
;; WinCE games — built on Sega's Windows CE devkit instead of the plain Katana
;; SDK. There is no "CE syscall layer" to emulate: the kernel ships on the game
;; disc and runs as ordinary SH4 code. What they need is the SH4 MMU — they run
;; with MMUCR.AT=1 and refill their page tables from the TLB-miss exception,
;; and NullDC4Wii only implements the store-queue remap (dc/mem/mmu.cpp).
;; wince=yes shows a warning after the options menu (A: launch
;; anyway, B: back to file list) instead of silently failing. See
;; compatibility.txt for the per-game symptom (boot to BIOS, white/black
;; screen, freeze). No other fields set — there is nothing to tune.
;; ---------------------------------------------------------------------------

