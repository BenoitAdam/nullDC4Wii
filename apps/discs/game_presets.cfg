[silent scope][silentscope]
; Confirmed from an [SS] pass capture: ONE TA list is rendered twice per frame.
; First half = translucent extras + the scope disc (22 wedges fanning from screen
; centre at W=1.6, textured from the RTT target 554000) + the 24x-magnified world
; confined by a mode-2 user tile clip to the 288x288 corner. That is rendered into
; a 256x256 texture (FB_W_SOF1=01554000, XCLIP/YCLIP 0..255). Then the ordinary 1x
; world is appended and the WHOLE list is rendered to the display.
; keep does two things: the RTT render no longer consumes the list (so the display
; render still has the disc and the HUD), and the list is split by user tile clip —
; the mode-2 clipped strips are the texture's content, the unclipped ones are the
; on-screen overlay. Without the split the magnified half paints the screen's
; top-left corner and Z-fights the real scene.
; split_screen is NOT needed: keep reads the tile clip itself.
render_to_texture=keep ; CONFIRMED working (Dolphin) — untested on real Wii
;; Dolphin only: Graphics > Hacks > uncheck "Store EFB Copies to Texture Only"
;; and "Skip EFB Access from CPU", or the scope texture reads back empty (black)
tex_cache=fast ; very_fast is playable but trash in menu and text message
trans_sort=on ; needed, very visible when demo is playing
y_scaler=on ; needed for the scope to be 100% accurate

