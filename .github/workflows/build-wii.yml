name: Wii Build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20261016
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Wii DOL
        run: |
          test -n "$DEVKITPPC"
          cd wii
          make clean
          make

      - name: Upload boot.dol
        uses: actions/upload-artifact@v4
        with:
          name: nullDC4Wii-boot-dol
          path: wii/boot.dol
          if-no-files-found: error
